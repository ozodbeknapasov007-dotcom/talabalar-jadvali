# Netlify (bepul tarif: oyiga 100 GB trafik). Portal — web/ papkasidagi Next.js; Netlify uni o'zi taniydi.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js server qismi (sahifalar, API) — Netlify funksiyalari sifatida. Avtomatik ulanmadi, shuning uchun aniq ko'rsatildi
[[plugins]]
  package = "@netlify/plugin-nextjs"
