<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hujjatlar tekshiruvi — 24 talaba</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#15181d; --muted:#6b7280; --line:#e3e6ea;
    --acc:#2563eb; --ok:#15803d; --okbg:#e9f7ee; --warn:#b45309; --warnbg:#fff5e6;
    --err:#b91c1c; --errbg:#fdecec; --crit:#7f1d1d; --critbg:#fbe3e3;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#101317; --panel:#181c21; --ink:#e8eaed; --muted:#9aa3ae; --line:#2a3036;
    --acc:#6ea8ff; --ok:#6ee7a0; --okbg:#12261a; --warn:#fbbf24; --warnbg:#2a2010;
    --err:#f87171; --errbg:#2c1515; --crit:#fca5a5; --critbg:#3a1414;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
         padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:650}
  .grow{flex:1}
  .stat{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .stat b{color:var(--ink)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
         color:var(--ink);border-radius:7px;padding:5px 11px}
  button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .wrap{max-width:1500px;margin:0 auto;padding:18px}

  /* ---- ro'yxat ---- */
  .list{display:grid;gap:9px}
  .row{background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:10px;
       padding:11px 14px;display:flex;gap:14px;align-items:center;cursor:pointer}
  .row:hover{border-color:var(--acc)}
  .row .nm{font-weight:600;min-width:270px}
  .row .sub{color:var(--muted);font-size:12.5px}
  .row.s-ok{border-left-color:var(--ok)} .row.s-no{border-left-color:var(--err)}
  .row.s-none{border-left-color:var(--line)}
  .badge{font-size:11.5px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
  .b-muhim{background:var(--critbg);color:var(--crit)}
  .b-xato{background:var(--errbg);color:var(--err)}
  .b-ogoh{background:var(--warnbg);color:var(--warn)}
  .b-toza{background:var(--okbg);color:var(--ok)}
  .b-tas{background:var(--okbg);color:var(--ok)}
  .b-rad{background:var(--errbg);color:var(--err)}

  /* ---- detail ---- */
  .top{position:sticky;top:47px;z-index:15;background:var(--bg);
       display:flex;gap:12px;align-items:center;padding:12px 0 10px;
       border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
  .top h2{margin:0;font-size:20px}

  /* har bir bo'lim: chapda ma'lumot (yopishib turadi), o'ngda o'sha hujjat rasmlari */
  .sect{display:grid;grid-template-columns:minmax(340px,410px) 1fr;gap:20px;
        align-items:start;margin-bottom:34px}
  .sect > .side{position:sticky;top:120px}
  .sect + .sect{border-top:1px solid var(--line);padding-top:22px}
  .sechd{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:13px;
         letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
  .sechd .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
            border-radius:50%;background:var(--acc);color:#fff;font-size:12px;letter-spacing:0}
  @media(max-width:980px){
    .sect{grid-template-columns:1fr}
    .sect > .side{position:static}
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  table.kv{width:100%;border-collapse:collapse}
  table.kv td{padding:4px 0;vertical-align:top;border-bottom:1px solid var(--line)}
  table.kv td:first-child{color:var(--muted);width:44%;padding-right:10px;font-size:13px}
  table.kv td:last-child{font-weight:550;word-break:break-word}
  tr.diff td:last-child{color:var(--err)}
  .mono{font-family:ui-monospace,Consolas,monospace;letter-spacing:.02em}
  .alert{border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13.5px;border-left:4px solid}
  .a-muhim{background:var(--critbg);color:var(--crit);border-color:var(--crit)}
  .a-xato{background:var(--errbg);color:var(--err);border-color:var(--err)}
  .a-ogoh{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}

  /* JSHSHIR bo'laklari */
  .pcode{font-family:ui-monospace,Consolas,monospace;font-size:19px;letter-spacing:.06em;
         margin:0 0 12px;display:flex;flex-wrap:wrap;cursor:help}
  .pcode span{padding:3px 4px;border-radius:5px;border-bottom:3px solid transparent}
  .pcode .c2{border-color:#6366f1} .pcode .c3{border-color:#059669;font-weight:700}
  .pcode .c4{border-color:#94a3b8} .pcode .c5{border-color:#d97706}
  .pcode span:first-child{border-color:#db2777}

  .imgblk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}
  .imghd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .imghd .t{font-weight:600;font-size:13.5px;flex:1}
  .imghd button{padding:2px 9px;font-size:13px}
  .imgbox{background:#0b0d10;border-radius:8px;overflow:auto;display:flex;align-items:center;
          justify-content:center;min-height:220px}
  .imgbox img{display:block;max-width:100%;transition:transform .15s;cursor:zoom-in}
  .imgbox img.r90,.imgbox img.r270{max-width:none;max-height:86vw}
  .nav{display:flex;gap:8px;margin-top:16px}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;display:none;
      align-items:center;justify-content:center;cursor:zoom-out;overflow:auto;padding:10px}
  #lb img{max-width:none}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <h1>Hujjatlar tekshiruvi</h1>
  <span class="stat" id="stat"></span>
  <span class="grow"></span>
  <button id="bBack" class="hide">← Ro‘yxatga</button>
  <button id="bExp">Natijani yuklab olish</button>
  <button id="bClr">Tozalash</button>
</header>
<div class="wrap">
  <div id="list" class="list"></div>
  <div id="det" class="hide"></div>
</div>
<div id="lb"><img id="lbi" alt=""></div>

<script src="data.js"></script>
<script>
const T = window.TALABALAR;
const LS = "tekshiruv_v1";
let S = {};
try{ S = JSON.parse(localStorage.getItem(LS)||"{}"); }catch(e){ S = {}; }
const save = ()=>{ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} };
const st  = id => (S[id]||{}).holat || "";
const rot = (id,f) => ((S[id]||{}).rot||{})[f] || 0;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const $list=document.getElementById("list"), $det=document.getElementById("det"),
      $back=document.getElementById("bBack"), $stat=document.getElementById("stat");

function worst(t){
  const k = (t.ogoh||[]).map(o=>o.t);
  if(k.includes("muhim")) return "muhim";
  if(k.includes("xato"))  return "xato";
  if(k.includes("ogoh"))  return "ogoh";
  return "toza";
}
const LBL={muhim:"Jiddiy muammo",xato:"Xatolik",ogoh:"Eslatma",toza:"Muammo yo‘q"};

function stats(){
  const ok=T.filter(t=>st(t.id)==="ok").length, no=T.filter(t=>st(t.id)==="no").length;
  $stat.innerHTML = `Jami <b>${T.length}</b> · tasdiqlangan <b>${ok}</b> · rad etilgan <b>${no}</b> · qolgan <b>${T.length-ok-no}</b>`;
}

function renderList(){
  $list.className="list"; $list.classList.remove("hide"); $det.classList.add("hide");
  $back.classList.add("hide");
  $list.innerHTML = T.map((t,i)=>{
    const w=worst(t), s=st(t.id);
    const mark = s==="ok" ? '<span class="badge b-tas">✓ Tasdiqlangan</span>'
               : s==="no" ? '<span class="badge b-rad">✕ Rad etilgan</span>' : "";
    return `<div class="row s-${s==="ok"?"ok":s==="no"?"no":"none"}" data-i="${i}">
      <span class="nm">${esc(t.pasport? (t.pasport.familiya.split(" (")[0]+" "+t.pasport.ism+" "+t.pasport.otasi) : t.royxat)}</span>
      <span class="sub">Shartnoma №${esc(t.shartnoma.raqam)} · ${t.rasmlar.length} rasm</span>
      <span class="grow"></span>
      ${mark}
      <span class="badge b-${w}">${LBL[w]}</span>
    </div>`;
  }).join("");
  $list.querySelectorAll(".row").forEach(r=>r.onclick=()=>renderDet(+r.dataset.i));
  stats();
}

function kv(rows){
  return `<table class="kv">${rows.filter(Boolean).map(([k,v,d])=>
    `<tr class="${d?'diff':''}"><td>${esc(k)}</td><td class="${/JSHSHIR|raqam/i.test(k)?'mono':''}">${esc(v)}</td></tr>`).join("")}</table>`;
}

/* ---- JSHSHIR (PINFL) tahlili -------------------------------------------
   14 raqam:  X | KKOOYY | RRR | SSS | C
   X   jins+asr (3/4 = 1900-lar E/A, 5/6 = 2000-lar E/A)
   RRR tug'ilgan joy (tuman) kodi — lug'at shu ma'lumotlarning o'zidan yig'iladi
   C   nazorat raqami: [7,3,1] og'irliklari, yig'indi mod 10                 */
const PW=[7,3,1,7,3,1,7,3,1,7,3,1,7];
const HUDUD=(()=>{ const m={};
  T.forEach(t=>{const p=t.pasport; if(!p||!/^\d{14}$/.test(p.jshshir)) return;
    const j=(p.tugilgan_joy||"").trim(); if(!j||j==="—") return;
    (m[p.jshshir.slice(7,10)]=m[p.jshshir.slice(7,10)]||new Set()).add(j);});
  const o={}; for(const k in m) o[k]=[...m[k]]; return o; })();

function decodePinfl(s){
  if(!/^\d{14}$/.test(s||"")) return null;
  const F={"1":[1800,"Erkak"],"2":[1800,"Ayol"],"3":[1900,"Erkak"],"4":[1900,"Ayol"],
           "5":[2000,"Erkak"],"6":[2000,"Ayol"]}[s[0]];
  const kod=s.slice(7,10), joy=(HUDUD[kod]||[]);
  return {
    jins:F?F[1]:"?", asr:F?F[0]+"-yillar":"?",
    sana:F?`${s.slice(1,3)}.${s.slice(3,5)}.${F[0]+ +s.slice(5,7)}`:"?",
    kod, joy: joy.length===1?joy[0] : joy.length? joy.join(" / ") : "noma’lum kod",
    tartib:s.slice(10,13),
    nazorat: PW.reduce((a,w,i)=>a+w*+s[i],0)%10 === +s[13]
  };
}

// rasm qaysi hujjatga tegishli: p = pasport, h = diplom/shahodatnoma, x = begona
function kat(l){
  if(/^\(/.test(l)) return "x";
  if(/ID karta|Pasport/i.test(l)) return "p";
  if(/Shahodatnoma|Diplom|Attestat/i.test(l)) return "h";
  return "x";
}

function renderDet(i){
  const t=T[i]; const p=t.pasport, h=t.hujjat, c=t.shartnoma;
  $list.classList.add("hide"); $det.classList.remove("hide"); $back.classList.remove("hide");
  const alerts=(t.ogoh||[]).map(o=>`<div class="alert a-${o.t}">${esc(o.m)}</div>`).join("");

  // rasmlarni asl tartib raqami bilan birga guruhlash (data-zoom indeksi to'g'ri qolishi uchun)
  const num = t.rasmlar.map((r,ri)=>({...r, ri, k:kat(r.l)}));
  const pic = k => num.filter(r=>r.k===k);

  const shot = r => `
    <div class="imgblk">
      <div class="imghd"><span class="t">${esc(r.l)}</span>
        <button data-rot="-90" data-f="${esc(r.f)}">↺</button>
        <button data-rot="90"  data-f="${esc(r.f)}">↻</button>
        <button data-zoom="${r.ri}">⤢ Katta</button>
      </div>
      <div class="imgbox"><img src="media/${encodeURIComponent(r.f)}" alt="${esc(r.l)}" data-f="${esc(r.f)}"></div>
    </div>`;
  const shots = (rs,bosh) => rs.length ? rs.map(shot).join("")
    : `<div class="card"><div class="alert a-muhim">${bosh}</div></div>`;

  const sect = (n,nom,side,right) => `<div class="sect">
      <div class="side"><div class="sechd"><span class="n">${n}</span>${nom}</div>${side}</div>
      <div>${right}</div>
    </div>`;

  // 1 — PASPORT: chapda ma'lumot, o'ngda o'sha pasport rasmlari
  const d = p ? decodePinfl(p.jshshir) : null;
  const pinflBlok = !p ? "" : !d
    ? `<div class="card"><h3>JSHSHIR tahlili</h3>
         <div class="alert a-ogoh">JSHSHIR yo‘q — tahlil qilib bo‘lmaydi.</div></div>`
    : `<div class="card"><h3>JSHSHIR tahlili</h3>
         <div class="pcode">
           <span title="jins + tug‘ilgan asr">${esc(p.jshshir[0])}</span><span
             title="tug‘ilgan sana KKOOYY" class="c2">${esc(p.jshshir.slice(1,7))}</span><span
             title="tug‘ilgan joy kodi" class="c3">${esc(p.jshshir.slice(7,10))}</span><span
             title="tartib raqami" class="c4">${esc(p.jshshir.slice(10,13))}</span><span
             title="nazorat raqami" class="c5">${esc(p.jshshir[13])}</span>
         </div>
         ${kv([
           ["Jinsi + asr", d.jins+" · "+d.asr, p.jinsi && d.jins.toLowerCase()!==p.jinsi.toLowerCase()],
           ["Tug‘ilgan sana", d.sana, d.sana!==p.tugilgan],
           ["Tug‘ilgan joy kodi", d.kod+" = "+d.joy,
             p.tugilgan_joy && p.tugilgan_joy!=="—" && d.joy!==p.tugilgan_joy],
           ["Tartib raqami", d.tartib],
           ["Nazorat raqami", d.nazorat? "to‘g‘ri ✓" : "XATO ✕", !d.nazorat]
         ])}</div>`;

  const s1 = sect(1,"Pasport / Shaxs guvohnomasi",
    `<div class="card">${ p? kv([
      ["Hujjat turi",p.turi],["Familiya",p.familiya],["Ism",p.ism],["Otasining ismi",p.otasi],
      ["Tug‘ilgan sana",p.tugilgan],["Jinsi",p.jinsi],["JSHSHIR (PINFL)",p.jshshir],
      ["Tug‘ilgan joyi",p.tugilgan_joy],["Seriya va raqam",p.raqam],
      ["Berilgan sana",p.berilgan],["Amal qilish muddati",p.amal],["Bergan organ",p.organ]
    ]) : '<div class="alert a-muhim">Pasport ma’lumoti yo‘q.</div>' }</div>${pinflBlok}`,
    shots(pic("p"),"Pasport rasmi yo‘q."));

  // 2 — DIPLOM/SHAHODATNOMA: chapda ma'lumot, o'ngda o'sha hujjat rasmi
  const s2 = sect(2,"Diplom / Shahodatnoma",
    `<div class="card">${ h? kv([
      ["Hujjat turi",h.turi],["Seriya va raqam",h.raqam],["Muassasa",h.muassasa],
      ["Joyi",h.joy],["O‘qigan yili",h.yil],["Berilgan sana",h.berilgan],["Qo‘shimcha",h.izoh]
    ]) : '<div class="alert a-muhim">Diplom/shahodatnoma ma’lumoti yo‘q.</div>' }</div>`,
    shots(pic("h"),"Diplom/shahodatnoma rasmi yo‘q."));

  // 3 — SHARTNOMA MATNI + qaror; o'ngda begona rasmlar (bo'lsa) va ogohlantirishlar
  const begona = pic("x");
  const s3 = sect(3,"Shartnoma matni va qaror",
    `<div class="card">${kv([
      ["Fayl nomi",t.fayl],["Kanal ro‘yxatida",t.royxat],["Shartnoma raqami",c.raqam],
      ["Shartnoma sanasi",c.sana],["Yo‘nalishi",c.yonalish],
      ["F.I.Sh.",c.fio, p && c.fio.toUpperCase().replace(/[‘’']/g,"").indexOf(p.familiya.split(" (")[0].replace(/[‘’']/g,""))!==0],
      ["Tugatgan o‘qish joyi",c.maktab],["Tugatgan yili",c.bitirgan],["Telefon",c.tel]
    ])}</div>
    <div class="card"><h3>Qaroringiz</h3>
      <div style="display:flex;gap:8px">
        <button id="yOk"  class="${st(t.id)==="ok"?"pri":""}" style="flex:1">✓ To‘g‘ri — tasdiqlayman</button>
        <button id="yNo"  class="${st(t.id)==="no"?"pri":""}" style="flex:1">✕ Xato — rad etaman</button>
      </div>
      <textarea id="izoh" placeholder="Izoh (ixtiyoriy)…" style="width:100%;margin-top:9px;min-height:56px;
        border:1px solid var(--line);border-radius:7px;padding:7px;background:transparent;color:inherit;font:inherit"></textarea>
    </div>`,
    begona.length
      ? `<div class="card"><h3>Fayldagi begona rasmlar</h3></div>`+begona.map(shot).join("")
      : `<div class="card"><div class="alert a-ogoh">Bu bo‘limga tegishli qo‘shimcha rasm yo‘q.</div></div>`);

  $det.innerHTML = `<div class="top">
      <h2>${esc(p? (p.familiya.split(" (")[0]+" "+p.ism+" "+p.otasi) : t.royxat)}</h2>
      <span class="badge b-${worst(t)}">${LBL[worst(t)]}</span>
      <span class="grow"></span>
      <button id="prv" ${i===0?"disabled":""}>← Oldingi</button>
      <button id="nxt" ${i===T.length-1?"disabled":""}>Keyingi →</button>
    </div>
    ${alerts?`<div style="margin-bottom:22px">${alerts}</div>`:""}
    ${s1}${s2}${s3}`;

  // rasm burilishlari
  const apply = ()=> $det.querySelectorAll(".imgbox img").forEach(im=>{
    const d=((rot(t.id,im.dataset.f))%360+360)%360;
    im.style.transform = `rotate(${d}deg)`;
    im.className = d===90?"r90":d===270?"r270":"";
  });
  apply();
  $det.querySelectorAll("[data-rot]").forEach(b=>b.onclick=()=>{
    S[t.id]=S[t.id]||{}; S[t.id].rot=S[t.id].rot||{};
    S[t.id].rot[b.dataset.f]=(rot(t.id,b.dataset.f)+ +b.dataset.rot); save(); apply();
  });
  const open = src => { document.getElementById("lbi").src=src;
                        document.getElementById("lb").style.display="flex"; };
  $det.querySelectorAll(".imgbox img").forEach(im=>im.onclick=()=>open(im.src));
  $det.querySelectorAll("[data-zoom]").forEach(b=>b.onclick=()=>
    open($det.querySelectorAll(".imgbox img")[+b.dataset.zoom].src));

  const iz=$det.querySelector("#izoh"); iz.value=(S[t.id]||{}).izoh||"";
  iz.oninput=()=>{ S[t.id]=S[t.id]||{}; S[t.id].izoh=iz.value; save(); };
  const set=v=>{ S[t.id]=S[t.id]||{}; S[t.id].holat=(S[t.id].holat===v?"":v); save(); renderDet(i); };
  $det.querySelector("#yOk").onclick=()=>set("ok");
  $det.querySelector("#yNo").onclick=()=>set("no");
  const pv=$det.querySelector("#prv"), nx=$det.querySelector("#nxt");
  if(!pv.disabled) pv.onclick=()=>{renderDet(i-1);scrollTo(0,0)};
  if(!nx.disabled) nx.onclick=()=>{renderDet(i+1);scrollTo(0,0)};
  stats(); scrollTo(0,0);
}

document.getElementById("lb").onclick=e=>e.currentTarget.style.display="none";
$back.onclick=renderList;
document.getElementById("bClr").onclick=()=>{
  if(confirm("Barcha tasdiq/rad va burilishlar o‘chirilsinmi?")){ S={}; save(); renderList(); } };
document.getElementById("bExp").onclick=()=>{
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const head=["Holat","Izoh","Familiya","Ism","Otasining ismi","Tug'ilgan sana","JSHSHIR",
    "Tug'ilgan joyi","Pasport raqami","Berilgan","Amal qiladi","Hujjat turi","Hujjat raqami",
    "Muassasa","Bitirgan","Shartnoma raqami","Shartnoma sanasi","Telefon","Fayl","Muammolar"];
  const rows=T.map(t=>{const p=t.pasport||{},h=t.hujjat||{},c=t.shartnoma,s=S[t.id]||{};
    return [s.holat==="ok"?"TASDIQLANGAN":s.holat==="no"?"RAD ETILGAN":"KO'RILMAGAN",s.izoh||"",
      p.familiya,p.ism,p.otasi,p.tugilgan,p.jshshir,p.tugilgan_joy,p.raqam,p.berilgan,p.amal,
      h.turi,h.raqam,h.muassasa,h.berilgan,c.raqam,c.sana,c.tel,t.fayl,
      (t.ogoh||[]).map(o=>o.m).join(" | ")].map(q).join(",");});
  const blob=new Blob(["﻿"+[head.map(q).join(","),...rows].join("\r\n")],
                      {type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="tekshiruv_natija.csv";a.click();
};
renderList();
</script>
</body>
</html>
