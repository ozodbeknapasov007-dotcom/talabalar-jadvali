<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontingent variantlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-950: #040b14; --ink-900: #07111f; --ink-850: #0a1728; --ink-800: #0e1e33; --ink-700: #15294a; --ink-600: #1f3a63;
    --line: rgb(125 175 235 / 0.12); --line-strong: rgb(125 175 235 / 0.22);
    --fg: #e8f1fb; --muted: #93acc8; --subtle: #5f7a99;
    --emerald: #10b981; --emerald-soft: #34d399; --blue: #3b82f6; --blue-soft: #60a5fa;
    --sky: #38bdf8; --sky-soft: #7dd3fc; --amber: #f59e0b; --rose: #f43f5e; --violet: #a78bfa;
    --k1: #38bdf8; --k2: #a78bfa; --k3: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink-950); color: var(--fg); font: 14px/1.45 'Plus Jakarta Sans', system-ui, sans-serif; padding: 28px 16px 80px; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .wrap { max-width: 1640px; margin: 0 auto; }
  header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  header.top h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  header.top p { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; }
  .toc a { color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .toc a:hover { color: var(--fg); border-color: var(--line-strong); }
  h2.part { font-size: 15px; font-weight: 800; color: var(--sky-soft); margin: 34px 0 12px; letter-spacing: 0.01em; }
  .variant { background: var(--ink-900); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 18px; }
  .vhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .vnum { display: grid; place-items: center; min-width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--blue), var(--sky)); color: var(--ink-950); font-weight: 800; font-size: 14px; }
  .vtitle { font-weight: 800; font-size: 14.5px; }
  .vdesc { color: var(--muted); font-size: 12.5px; }
  .panel { background: var(--ink-850); border: 1px solid var(--line); border-radius: 14px; }
  .pick { cursor: pointer; transition: border-color .15s, background .15s, opacity .15s, transform .15s; }
  .pick:hover { border-color: var(--line-strong); background: var(--ink-800); }
  .pick.on { border-color: rgb(56 189 248 / .7); box-shadow: 0 0 0 2px rgb(56 189 248 / .35); background: linear-gradient(135deg, rgb(56 189 248 / .14), transparent); }
  .dim .pick:not(.on) { opacity: .5; }
  .code { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--blue-soft); }
  .code.farm { color: var(--emerald-soft); }
  .muted { color: var(--muted); } .subtle { color: var(--subtle); }
  .bar { height: 6px; border-radius: 99px; background: var(--ink-700); overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--emerald), var(--emerald-soft)); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .k1 { --k: var(--k1); } .k2 { --k: var(--k2); } .k3 { --k: var(--k3); }
  .kdot { width: 8px; height: 8px; border-radius: 50%; background: var(--k); display: inline-block; }
  .ok { color: var(--emerald-soft); font-weight: 700; }
  .cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .cols3 { grid-template-columns: 1fr; } }
  .colhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .colhead b { font-size: 15px; font-weight: 800; }
  .roman { font-family: 'JetBrains Mono', monospace; font-weight: 800; color: var(--k); font-size: 18px; margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Kontingent — ko'rinish variantlari</h1>
      <p>Haqiqiy ma'lumot: <span id="sum"></span>. Kartani bosing — tanlanganini ko'rsatadi (portaldagidek filtr).</p>
    </div>
    <nav class="toc" id="toc"></nav>
  </header>
  <h2 class="part">Umumiy ko'rinishlar (1–10)</h2>
  <div id="partA"></div>
  <h2 class="part">Kurslar bo'yicha ustunlar: I · II · III (11–20)</h2>
  <div id="partB"></div>
</div>

<script>
const DATA = {"groups": [{"g": "24-11", "kurs": 3, "title": "Hamshiralik ishi", "leader": "Rahmatova.Sh", "total": 27, "ver": 27}, {"g": "24-12", "kurs": 3, "title": "Hamshiralik ishi", "leader": "Botirova.G", "total": 24, "ver": 24}, {"g": "24-13", "kurs": 3, "title": "Hamshiralik ishi", "leader": "Elmurodova.N", "total": 24, "ver": 24}, {"g": "24-15", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Asraliyev.A", "total": 21, "ver": 21}, {"g": "24-16", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Yuldashev.O", "total": 20, "ver": 20}, {"g": "25-16", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Xidirova.N", "total": 24, "ver": 24}, {"g": "25-17", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Meyliyev.B", "total": 22, "ver": 22}, {"g": "25-18", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Eshnayev.B", "total": 25, "ver": 25}, {"g": "25-19", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Shukurova.G", "total": 28, "ver": 28}, {"g": "25-20", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Maxamadiyev.L", "total": 26, "ver": 26}, {"g": "25-21", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Eshnayev.B", "total": 29, "ver": 29}, {"g": "25-22", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Rahmatova.Sh", "total": 28, "ver": 28}, {"g": "25-23", "kurs": 2, "title": "Hamshiralik ishi", "leader": "Quldosheva.K", "total": 23, "ver": 23}, {"g": "26-01", "kurs": 1, "title": "Farmatsiya ishi", "leader": "Mirzayeva.D", "total": 14, "ver": 14}, {"g": "26-02", "kurs": 1, "title": "Hamshiralik ishi", "leader": "Ochilov.D", "total": 34, "ver": 30}, {"g": "26-03", "kurs": 1, "title": "Hamshiralik ishi", "leader": "A.Asraliyev", "total": 33, "ver": 33}, {"g": "26-04", "kurs": 1, "title": "Hamshiralik ishi", "leader": "Xamdamova.M", "total": 32, "ver": 32}, {"g": "26-05", "kurs": 1, "title": "Hamshiralik ishi", "leader": "Rayimova.X", "total": 32, "ver": 32}, {"g": "26-06", "kurs": 1, "title": "Hamshiralik ishi", "leader": "Yuldashev.O", "total": 35, "ver": 34}], "special": {"akad": 24, "tsch": 31}};
const G = DATA.groups;
const ROMAN = { 1: 'I', 2: 'II', 3: 'III' };
const KURS = [1, 2, 3].map((k) => ({ k, groups: G.filter((g) => g.kurs === k) }))
  .map((c) => ({ ...c, total: c.groups.reduce((a, g) => a + g.total, 0), ver: c.groups.reduce((a, g) => a + g.ver, 0) }));
const TOTAL = G.reduce((a, g) => a + g.total, 0), VER = G.reduce((a, g) => a + g.ver, 0);
const pct = (g) => (g.total ? Math.round((g.ver / g.total) * 100) : 0);
const farm = (g) => g.title.startsWith('Farmatsiya');
const code = (g) => `<span class="code ${farm(g) ? 'farm' : ''}">${g.g}</span>`;
const bar = (g) => `<span class="bar"><i style="width:${pct(g)}%"></i></span>`;
const verTxt = (g) => `<span class="${pct(g) === 100 ? 'ok' : 'muted'} mono" style="font-size:11.5px">${g.ver}/${g.total}</span>`;
const attrs = (g, extra = '') => `class="pick ${extra} k${g.kurs}" data-g="${g.g}" title="${g.g} · ${g.leader} · ${g.title}"`;
document.getElementById('sum').textContent = `${G.length} guruh, ${TOTAL} talaba (I: ${KURS[0].total}, II: ${KURS[1].total}, III: ${KURS[2].total}), ${VER} tasdiqlangan`;

const variants = [];
const V = (part, title, desc, html) => variants.push({ part, title, desc, html });

/* ---------------- UMUMIY ---------------- */
V('A', "Kartalar, bir necha qatorga o'raladi", "Hozirgi karta dizayni, lekin har biri kamida 160px — sig'maganlari keyingi qatorga tushadi.", () => `
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">${G.map((g) => `
    <div ${attrs(g, 'panel')} style="padding:12px;position:relative;overflow:hidden">
      <span style="position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--k),transparent)"></span>
      <div style="display:flex;justify-content:space-between;align-items:baseline">${code(g)}<span class="muted" style="font-size:12px;font-weight:600">${g.total} nafar</span></div>
      <div class="muted" style="font-size:12px;margin-top:2px">${g.title}</div>
      <div style="font-size:12.5px;font-weight:700;margin-top:1px">${g.leader}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:9px">${bar(g)}${verTxt(g)}</div>
    </div>`).join('')}</div>`);

V('A', 'Ixcham chiplar', "Har guruh bitta chip: kod, soni va rahbari. Juda kam joy oladi, 2 qatorga sig'adi.", () => `
  <div style="display:flex;flex-wrap:wrap;gap:8px">${G.map((g) => `
    <div ${attrs(g, 'panel')} style="display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px">
      <span class="kdot"></span>${code(g)}<b style="font-size:13px">${g.total}</b><span class="muted" style="font-size:12px">${g.leader}</span>
      <span style="width:40px">${bar(g)}</span>
    </div>`).join('')}</div>`);

V('A', 'Jadval', 'Barcha ma\'lumot bir qarashda: kurs, guruh, yo\'nalish, rahbar, soni va tasdiq.', () => `
  <div class="panel" style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
    <thead><tr class="subtle" style="text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em">
      ${['Kurs', 'Guruh', "Yo'nalish", 'Guruh rahbari', 'Soni', 'Tasdiqlangan'].map((h) => `<th style="padding:9px 12px;border-bottom:1px solid var(--line)">${h}</th>`).join('')}</tr></thead>
    <tbody>${G.map((g) => `<tr ${attrs(g)}>
      <td style="padding:8px 12px;border-bottom:1px solid var(--line)"><span class="roman" style="font-size:13px">${ROMAN[g.kurs]}</span></td>
      <td style="padding:8px 12px;border-bottom:1px solid var(--line)">${code(g)}</td>
      <td class="muted" style="padding:8px 12px;border-bottom:1px solid var(--line)">${g.title}</td>
      <td style="padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600">${g.leader}</td>
      <td class="mono" style="padding:8px 12px;border-bottom:1px solid var(--line)">${g.total}</td>
      <td style="padding:8px 12px;border-bottom:1px solid var(--line);min-width:180px"><div style="display:flex;align-items:center;gap:8px">${bar(g)}${verTxt(g)}</div></td></tr>`).join('')}</tbody></table></div>`);

V('A', "Gorizontal aylantiriladigan qator", "Hozirgidek bitta qator, lekin kartalar kesilmaydi — sichqoncha g'ildiragi yoki strelka bilan suriladi.", () => `
  <div style="display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px">${G.map((g) => `
    <div ${attrs(g, 'panel')} style="flex:0 0 170px;scroll-snap-align:start;padding:12px">
      <div style="display:flex;justify-content:space-between">${code(g)}<span class="tag"><span class="kdot"></span>${ROMAN[g.kurs]}</span></div>
      <div style="font-size:22px;font-weight:800;margin-top:4px">${g.total}<span class="muted" style="font-size:12px;font-weight:600"> nafar</span></div>
      <div style="font-size:12.5px;font-weight:700">${g.leader}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">${bar(g)}${verTxt(g)}</div>
    </div>`).join('')}</div>`);

V('A', 'Issiqlik xaritasi (plitkalar)', "Kichik kvadratlar: rang — tasdiqlanish foizi, raqam — talabalar soni. Rahbar sichqoncha ustiga olib borilganda.", () => `
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px">${G.map((g) => {
    const p = pct(g); const c = p === 100 ? '16 185 129' : p >= 80 ? '56 189 248' : '245 158 11';
    return `<div ${attrs(g)} style="border-radius:12px;padding:10px 8px;text-align:center;border:1px solid rgb(${c} / .35);background:rgb(${c} / ${0.08 + p / 500})">
      ${code(g)}<div style="font-size:20px;font-weight:800;line-height:1.2">${g.total}</div><div class="mono" style="font-size:11px;color:rgb(${c})">${p}%</div></div>`;
  }).join('')}</div>`);

V('A', 'Gorizontal ustunli diagramma', "Har guruh bitta chiziq: uzunligi — talabalar soni, yashil qismi — tasdiqlanganlar.", () => {
  const max = Math.max(...G.map((g) => g.total));
  return `<div class="panel" style="padding:12px 14px;display:grid;gap:6px">${G.map((g) => `
    <div ${attrs(g)} style="display:grid;grid-template-columns:62px 130px 1fr 60px;align-items:center;gap:10px;padding:3px 6px;border-radius:8px;border:1px solid transparent">
      ${code(g)}<span style="font-size:12.5px;font-weight:600">${g.leader}</span>
      <span style="height:14px;border-radius:6px;background:var(--ink-700);position:relative;width:${(g.total / max) * 100}%">
        <i style="position:absolute;inset:0 auto 0 0;width:${pct(g)}%;border-radius:6px;background:linear-gradient(90deg,var(--emerald),var(--emerald-soft))"></i></span>
      <span class="mono" style="font-size:12px;text-align:right">${g.ver}/${g.total}</span></div>`).join('')}</div>`;
});

V('A', "Ro'yxat kartalari, 4–5 ustun", "Har guruh bitta ixcham qator: chapda kod, o'rtada rahbar, o'ngda soni. Ko'p guruhda ham tartibli.", () => `
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px">${G.map((g) => `
    <div ${attrs(g, 'panel')} style="display:flex;align-items:center;gap:10px;padding:9px 12px">
      <span style="width:4px;align-self:stretch;border-radius:4px;background:var(--k)"></span>
      ${code(g)}<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g.leader}</div><div class="muted" style="font-size:11.5px">${g.title}</div></div>
      <div style="text-align:right"><div style="font-weight:800">${g.total}</div>${verTxt(g)}</div></div>`).join('')}</div>`);

V('A', 'Halqa (donut) kartalar', "Har guruhda aylana: to'lgan qismi — tasdiqlanish foizi, markazda soni.", () => `
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px">${G.map((g) => {
    const p = pct(g), r = 26, c = 2 * Math.PI * r;
    return `<div ${attrs(g, 'panel')} style="padding:12px 8px;text-align:center">
      <svg width="68" height="68" viewBox="0 0 68 68"><circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--ink-700)" stroke-width="7"/>
      <circle cx="34" cy="34" r="${r}" fill="none" stroke="var(--emerald)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c * p) / 100} ${c}" transform="rotate(-90 34 34)"/>
      <text x="34" y="39" text-anchor="middle" fill="var(--fg)" font-size="15" font-weight="800" font-family="Plus Jakarta Sans">${g.total}</text></svg>
      <div>${code(g)}</div><div class="muted" style="font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g.leader}</div></div>`;
  }).join('')}</div>`);

V('A', "Yo'nalish bo'yicha guruhlash", "Hamshiralik ishi va Farmatsiya ishi alohida bloklarda, ichida chiplar.", () => {
  const dirs = [...new Set(G.map((g) => g.title))];
  return `<div style="display:grid;gap:10px">${dirs.map((t) => { const gs = G.filter((g) => g.title === t); const tot = gs.reduce((a, g) => a + g.total, 0);
    return `<div class="panel" style="padding:12px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>${t}</b><span class="muted">${gs.length} guruh · ${tot} nafar</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${gs.map((g) => `<div ${attrs(g)} style="display:flex;gap:7px;align-items:center;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--ink-900)">
      <span class="kdot"></span>${code(g)}<b>${g.total}</b><span class="muted" style="font-size:12px">${g.leader}</span></div>`).join('')}</div></div>`; }).join('')}</div>`;
});

V('A', 'Umumiy chiziq + izoh', "Tepada bitta uzun chiziq: har guruh ulushi bo'yicha bo'lak (rang — kurs). Ostida ixcham izoh.", () => `
  <div class="panel" style="padding:14px">
    <div style="display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px">${G.map((g) => `<div ${attrs(g)} style="flex:${g.total};background:var(--k);opacity:.8;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink-950)">${g.g}</div>`).join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px">${G.map((g) => `<span ${attrs(g)} style="display:flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 6px;border-radius:8px;border:1px solid transparent"><span class="kdot"></span>${code(g)} <b>${g.total}</b> <span class="muted">${g.leader}</span></span>`).join('')}</div>
    <div style="display:flex;gap:14px;margin-top:10px" class="muted">${KURS.map((c) => `<span class="k${c.k}" style="display:flex;gap:6px;align-items:center;font-size:12px"><span class="kdot"></span>${ROMAN[c.k]}-kurs: ${c.total}</span>`).join('')}</div>
  </div>`);

/* ---------------- KURS USTUNLARI ---------------- */
const colWrap = (inner, opts = {}) => `<div class="cols3">${KURS.map((c) => `
  <div class="panel k${c.k}" style="overflow:hidden;${opts.style || ''}">
    <div class="colhead" style="border-top:3px solid var(--k)"><b><span class="roman">${ROMAN[c.k]}</span>kurs</b>
      <span class="muted" style="font-size:12.5px">${c.groups.length} guruh · <b style="color:var(--fg)">${c.total}</b> nafar · <span class="ok">${c.ver}</span></span></div>
    <div style="padding:10px">${inner(c)}</div></div>`).join('')}</div>`;

V('B', 'Ustunlar, ichida to\'liq kartalar', 'Har kurs alohida ustun, guruhlar kartalari 2 tadan yonma-yon.', () => colWrap((c) => `
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${c.groups.map((g) => `
    <div ${attrs(g, 'panel')} style="padding:10px;background:var(--ink-900)">
      <div style="display:flex;justify-content:space-between">${code(g)}<span class="muted" style="font-size:12px">${g.total} nafar</span></div>
      <div style="font-size:12.5px;font-weight:700;margin-top:2px">${g.leader}</div><div class="muted" style="font-size:11.5px">${g.title}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:7px">${bar(g)}${verTxt(g)}</div></div>`).join('')}</div>`));

V('B', "Ustunlar, ichida ro'yxat", "Har kurs ustunida guruhlar bitta qatordan: kod — rahbar — soni. Eng ixcham kurs ko'rinishi.", () => colWrap((c) => c.groups.map((g) => `
  <div ${attrs(g)} style="display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;border:1px solid transparent">
    ${code(g)}<span style="font-size:12.5px;font-weight:600">${g.leader}</span><span><b>${g.total}</b> ${verTxt(g)}</span></div>`).join('')));

V('B', 'Kanban uslubi', "Ustun sarlavhasida kurs jami va umumiy tasdiq chizig'i, ostida guruh kartochkalari.", () => `<div class="cols3">${KURS.map((c) => `
  <div class="k${c.k}" style="background:var(--ink-850);border-radius:14px;padding:10px;border:1px solid var(--line)">
    <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:15px"><span class="roman">${ROMAN[c.k]}</span>kurs</b><span class="tag"><span class="kdot"></span>${c.total} nafar</span></div>
    <div style="display:flex;align-items:center;gap:8px;margin:8px 0 10px">${bar(c)}<span class="mono ok" style="font-size:11.5px">${pct(c)}%</span></div>
    <div style="display:grid;gap:6px">${c.groups.map((g) => `<div ${attrs(g)} style="background:var(--ink-900);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center">
      <div>${code(g)} <span class="muted" style="font-size:12px">· ${g.leader}</span></div><b>${g.total}</b></div>`).join('')}</div></div>`).join('')}</div>`);

V('B', "Kurs sarlavhali yagona jadval", "Bitta jadval, lekin kurslar sarlavha qatorlari bilan ajratilgan (I, II, III) va har biriga jami.", () => `
  <div class="panel" style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tbody>${KURS.map((c) => `
    <tr class="k${c.k}" style="background:var(--ink-800)"><td colspan="4" style="padding:8px 12px;border-left:3px solid var(--k)"><span class="roman">${ROMAN[c.k]}</span><b>kurs</b></td>
      <td class="mono" style="padding:8px 12px"><b>${c.total}</b></td><td style="padding:8px 12px" class="ok mono">${c.ver}/${c.total}</td></tr>
    ${c.groups.map((g) => `<tr ${attrs(g)}><td style="padding:7px 12px 7px 26px;border-bottom:1px solid var(--line)">${code(g)}</td><td class="muted" style="border-bottom:1px solid var(--line)">${g.title}</td>
      <td style="border-bottom:1px solid var(--line);font-weight:600">${g.leader}</td><td style="border-bottom:1px solid var(--line);min-width:140px"><span style="display:flex">${bar(g)}</span></td>
      <td class="mono" style="padding:7px 12px;border-bottom:1px solid var(--line)">${g.total}</td><td style="padding:7px 12px;border-bottom:1px solid var(--line)">${verTxt(g)}</td></tr>`).join('')}`).join('')}</tbody></table></div>`);

V('B', 'Rangli panellar + chiplar', "Har kurs o'z rangidagi panel, guruhlar ichida chip ko'rinishida — juda ixcham.", () => `<div class="cols3">${KURS.map((c) => `
  <div class="k${c.k}" style="border-radius:14px;padding:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--k) 16%,transparent),var(--ink-900) 70%);border:1px solid color-mix(in srgb,var(--k) 35%,transparent)">
    <div style="display:flex;align-items:baseline;justify-content:space-between"><span class="roman" style="font-size:26px">${ROMAN[c.k]}</span><span><b style="font-size:20px">${c.total}</b> <span class="muted">nafar</span></span></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${c.groups.map((g) => `<span ${attrs(g)} style="padding:5px 9px;border-radius:9px;background:rgb(4 11 20 / .55);border:1px solid var(--line);font-size:12.5px">${code(g)} <b>${g.total}</b></span>`).join('')}</div></div>`).join('')}</div>`);

V('B', 'Ustunlar, ichida chiziqli diagramma', 'Har kurs ustunida guruhlar gorizontal chiziq ko\'rinishida (uzunligi — soni).', () => {
  const max = Math.max(...G.map((g) => g.total));
  return colWrap((c) => c.groups.map((g) => `
    <div ${attrs(g)} style="padding:5px 6px;border-radius:8px;border:1px solid transparent">
      <div style="display:flex;justify-content:space-between;font-size:12px">${code(g)}<span class="muted">${g.leader} · <b style="color:var(--fg)">${g.total}</b></span></div>
      <div style="height:8px;border-radius:5px;background:var(--ink-700);margin-top:4px;width:${(g.total / max) * 100}%;position:relative"><i style="position:absolute;inset:0;width:${pct(g)}%;border-radius:5px;background:var(--k)"></i></div></div>`).join(''));
});

V('B', 'Ustunlar, ichida issiqlik plitkalari', "Har kursda kichik kvadratlar: raqam — soni, rang to'qligi — tasdiqlanish.", () => colWrap((c) => `
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px">${c.groups.map((g) => `
    <div ${attrs(g)} style="border-radius:10px;padding:8px 6px;text-align:center;border:1px solid color-mix(in srgb,var(--k) 40%,transparent);background:color-mix(in srgb,var(--k) ${8 + pct(g) / 6}%,transparent)">
      ${code(g)}<div style="font-size:18px;font-weight:800">${g.total}</div><div class="muted" style="font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g.leader}</div></div>`).join('')}</div>`));

V('B', 'Ustunlar, ichida halqalar', 'Har kurs ustunida guruhlar kichik halqa (donut) bilan, 3 tadan qatorda.', () => colWrap((c) => `
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">${c.groups.map((g) => {
    const p = pct(g), r = 20, cc = 2 * Math.PI * r;
    return `<div ${attrs(g)} style="text-align:center;padding:6px 2px;border-radius:10px;border:1px solid transparent">
      <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--ink-700)" stroke-width="6"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--k)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(cc * p) / 100} ${cc}" transform="rotate(-90 26 26)"/>
      <text x="26" y="30" text-anchor="middle" fill="var(--fg)" font-size="12" font-weight="800" font-family="Plus Jakarta Sans">${g.total}</text></svg><div>${code(g)}</div></div>`;
  }).join('')}</div>`));

V('B', "Ustun sarlavhasida katta raqam", "Har kurs ustuni tepasida katta jami va foiz, ostida guruhlar ixcham 2 qatorli kartochkalarda.", () => `<div class="cols3">${KURS.map((c) => `
  <div class="panel k${c.k}" style="padding:14px">
    <div style="display:flex;align-items:center;gap:12px"><span style="display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--k) 18%,transparent);border:1px solid color-mix(in srgb,var(--k) 45%,transparent)" class="roman">${ROMAN[c.k]}</span>
      <div><div style="font-size:26px;font-weight:800;line-height:1">${c.total}</div><div class="muted" style="font-size:12px">${c.groups.length} guruh · ${pct(c)}% tasdiqlangan</div></div></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px">${c.groups.map((g) => `<div ${attrs(g)} style="border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--ink-900)">
      <div style="display:flex;justify-content:space-between">${code(g)}<b>${g.total}</b></div><div class="muted" style="font-size:11.5px">${g.leader}</div></div>`).join('')}</div></div>`).join('')}</div>`);

V('B', "Gorizontal yo'laklar (I / II / III qatorlari)", "Ustun o'rniga uchta yo'lak: har kurs bitta qatorda, chapda kurs belgisi va jami — keng ekranga mos.", () => `<div style="display:grid;gap:8px">${KURS.map((c) => `
  <div class="panel k${c.k}" style="display:flex;align-items:stretch;overflow:hidden">
    <div style="flex:0 0 110px;padding:10px 12px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--k) 10%,transparent)"><span class="roman" style="font-size:22px">${ROMAN[c.k]}</span><div style="font-weight:800;font-size:18px">${c.total}</div><div class="muted" style="font-size:11.5px">${c.groups.length} guruh</div></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;padding:10px;align-content:center">${c.groups.map((g) => `<div ${attrs(g)} style="border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--ink-900);min-width:138px">
      <div style="display:flex;justify-content:space-between;gap:8px">${code(g)}<b>${g.total}</b></div><div class="muted" style="font-size:11.5px">${g.leader}</div></div>`).join('')}</div></div>`).join('')}</div>`);

/* ---------------- CHIZISH ---------------- */
const toc = document.getElementById('toc');
variants.forEach((v, i) => {
  const n = i + 1;
  const el = document.createElement('section');
  el.className = 'variant'; el.id = `v${n}`;
  el.innerHTML = `<div class="vhead"><span class="vnum">${n}</span><div><div class="vtitle">${v.title}</div><div class="vdesc">${v.desc}</div></div></div><div class="vbody">${v.html()}</div>`;
  document.getElementById(v.part === 'A' ? 'partA' : 'partB').appendChild(el);
  toc.insertAdjacentHTML('beforeend', `<a href="#v${n}">${n}</a>`);
});
document.addEventListener('click', (e) => {
  const p = e.target.closest('.pick'); if (!p) return;
  const body = p.closest('.vbody'); const g = p.dataset.g; const on = p.classList.contains('on');
  body.querySelectorAll('.pick').forEach((x) => x.classList.toggle('on', !on && x.dataset.g === g));
  body.classList.toggle('dim', !on);
});
</script>
</body>
</html>
